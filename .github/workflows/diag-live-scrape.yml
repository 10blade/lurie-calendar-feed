name: Diagnostic live scrape (temporary)

on:
  push:
    branches: ["diag/live-scrape"]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run scraper (capture output, never fail)
        run: |
          mkdir -p diag
          set +e
          python -m lurie_calendar update --days-ahead 180 > diag/update_stdout.txt 2> diag/update_stderr.txt
          echo "exit=$?" > diag/exit.txt
          python -m lurie_calendar validate data/lurie_events.json > diag/validate.txt 2>&1
          echo "validate_exit=$?" >> diag/exit.txt
          pip freeze > diag/pip_freeze.txt
          true

      - name: Save linked PDFs and their extracted text
        run: |
          python - <<'PY'
          import json, pathlib, re
          import httpx
          from lurie_calendar.pdf_extract import extract_text_from_pdf_bytes
          from lurie_calendar.scrape_calendar import USER_AGENT
          out_pdf = pathlib.Path("diag/pdfs"); out_pdf.mkdir(parents=True, exist_ok=True)
          out_txt = pathlib.Path("diag/pdf_text"); out_txt.mkdir(parents=True, exist_ok=True)
          urls = set()
          for f in pathlib.Path("artifacts").glob("*/discovered_pdf_urls.json"):
              for lst in json.loads(f.read_text()).values():
                  urls.update(lst)
          index = {}
          with httpx.Client(follow_redirects=True, timeout=30, headers={"User-Agent": USER_AGENT}) as c:
              for u in sorted(urls):
                  name = re.sub(r"[^A-Za-z0-9_.-]+", "_", u.split("://", 1)[-1])[-150:]
                  try:
                      r = c.get(u)
                      index[u] = {"status": r.status_code, "ctype": r.headers.get("content-type"), "file": name}
                      if r.content.startswith(b"%PDF"):
                          (out_pdf / name).write_bytes(r.content)
                          try:
                              t = extract_text_from_pdf_bytes(r.content)
                          except Exception as e:
                              t = f"EXTRACT ERROR: {e}"
                          (out_txt / (name + ".txt")).write_text(t, encoding="utf-8")
                  except Exception as e:
                      index[u] = {"error": str(e)}
          pathlib.Path("diag/pdf_index.json").write_text(json.dumps(index, indent=2))
          PY

      - name: Commit diagnostics back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts diag data docs logs
          git commit -m "Diagnostic scrape output" || echo "nothing to commit"
          git push
